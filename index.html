<!doctype html>
<html lang="en" style="background:#0a0a0a">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Seven Daily</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Seven">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#0a0a0a;--sf:#141414;--ink:#fff;--mu:#8c8c8c;--ln:#262626;--g:#22c55e;--gs:#0f2417;--pt:#1c1c1c}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg)}
body{color:var(--ink);font:16px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--g);outline-offset:2px}
svg{display:block}

/* scrolls inside #app so the scroll bar can be hidden */
#app{height:100%;overflow-y:auto;scrollbar-width:none;
  padding:calc(env(safe-area-inset-top) + 16px) max(16px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 24px) max(16px,env(safe-area-inset-left))}
#app::-webkit-scrollbar{display:none}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;align-items:baseline;font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}

.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:16px;transition:background .3s,border-color .3s}
#day.done{background:var(--gs);border-color:var(--g)}
.bar{height:5px;border-radius:3px;background:var(--pt);overflow:hidden;margin-bottom:6px}
#bar{height:100%;width:0;background:var(--g);transition:width .25s}
#goals{list-style:none;margin:0;padding:0;transition:opacity .16s,transform .16s}
#goals.fade{opacity:0;transform:translateY(4px)}
#goals li+li{border-top:1px solid var(--ln)}
.goal{display:flex;align-items:center;gap:14px;width:100%;padding:13px 2px;text-align:left}
.goal:disabled{opacity:.5;cursor:default}
.box{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid #3a3a3a;display:grid;place-items:center;color:var(--bg)}
.box svg{width:16px;height:16px;opacity:0}
.on .box{background:var(--g);border-color:var(--g)}
.on .box svg{opacity:1}
.label{flex:1;min-width:0;overflow-wrap:anywhere}
.on .label{color:var(--mu);text-decoration:line-through}
#goals input{display:block;width:100%;height:44px;margin:5px 0;padding:0 10px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:8px;-webkit-user-select:text;user-select:text}

.row{display:flex;justify-content:space-between;align-items:center}
.tools{justify-content:flex-end;margin-top:6px}
.ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--mu);font-size:1.3rem;transition:background .25s,color .25s}
.ico svg{width:20px;height:20px}
.ico.act{background:var(--g);color:var(--bg)}
.ico:disabled{opacity:.3;cursor:default}
#edit svg{animation:pop .25s}
@keyframes pop{from{opacity:0;transform:scale(.6)}}

#month{font-weight:600;font-variant-numeric:tabular-nums}
#grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.wd{font-size:.7rem;color:var(--mu);text-align:center}
.c{aspect-ratio:1;border-radius:10px;border:1px solid transparent;background:var(--pt);font-size:.85rem;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.c:disabled{background:none;border-color:var(--ln);color:var(--mu);opacity:.5;cursor:default}
.c.all{background:var(--g);color:var(--bg);font-weight:700}
.c.s{border-color:var(--mu)}
.c.t{border-color:var(--ink)}
.mk{width:13px;height:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"><div class="wrap">
  <header><span id="date"></span><span id="streak">0</span></header>

  <section class="card" id="day">
    <div class="bar"><div id="bar"></div></div>
    <ul id="goals"></ul>
    <div class="row tools"><button class="ico" id="edit" type="button"></button></div>
  </section>

  <section class="card">
    <div class="row">
      <span id="month"></span>
      <span class="row"><button class="ico" id="prev" type="button" aria-label="Previous month">&#8249;</button><button class="ico" id="next" type="button" aria-label="Next month">&#8250;</button></span>
    </div>
    <div id="grid"></div>
  </section>
</div></div>

<script>
// Dark launch screen. iOS shows a launch image while a Home Screen app starts, and white
// if none matches this exact screen. So, in Safari (where you tap "Add to Home Screen"),
// draw a dark image the exact size of this phone's screen. iOS saves it when the app is added.
if (navigator.standalone === false) {
  const w = screen.width, h = screen.height, r = devicePixelRatio || 1, cv = document.createElement("canvas");
  cv.width = Math.round(w * r); cv.height = Math.round(h * r);
  const cx = cv.getContext("2d"); cx.fillStyle = "#0a0a0a"; cx.fillRect(0, 0, cv.width, cv.height);
  document.head.append(Object.assign(document.createElement("link"), {
    rel: "apple-touch-startup-image", href: cv.toDataURL("image/png"),
    media: `(device-width: ${w}px) and (device-height: ${h}px) and (-webkit-device-pixel-ratio: ${r}) and (orientation: portrait)`
  }));
}
(() => {
  const START = "2026-11-25", KEY = "seven-daily-v1", LS = localStorage;
  const CHECK = '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.2 3L13 4.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const MARK = CHECK.replace("<svg", '<svg class="mk"');
  const PENCIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
  const WEEK = [..."MTWTFSS"].map(w => `<span class="wd">${w}</span>`).join("");
  const [app, ul, editBtn, dateEl, barEl, dayEl, grid, monthEl, prevBtn, nextBtn, streakEl] =
    ["app", "goals", "edit", "date", "bar", "day", "grid", "month", "prev", "next", "streak"].map(id => document.getElementById(id));

  const p2 = n => String(n).padStart(2, "0");
  const keyOf = d => d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate());
  const parse = k => { const [y, m, d] = k.split("-"); return new Date(y, m - 1, d); };
  const today = () => keyOf(new Date());

  // ---------- data (stored only on this phone) ----------
  let state;
  try { state = JSON.parse(LS.getItem(KEY)); } catch (e) {}
  if (!state || !Array.isArray(state.goals)) state = { goals: Array.from({ length: 7 }, (_, i) => "Goal " + (i + 1)), days: {} };
  const save = () => { try { LS.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
  try { LS.removeItem("seven-daily-pin"); } catch (e) {} // old PIN from earlier versions
  navigator.storage?.persist?.().catch(() => {});

  let t = today(), sel = t < START ? START : t, editing = false, view;
  const showMonth = k => { view = parse(k); view.setDate(1); };
  showMonth(sel);
  const ticks = k => state.days[k] || [];
  const count = k => ticks(k).filter(Boolean).length;
  const allDone = k => count(k) === 7;
  const open = k => k >= START && k <= t; // any day from the start up to today can be ticked

  // ---------- goals of the selected day ----------
  function renderGoals() {
    ul.innerHTML = state.goals.map((_, i) => editing
      ? `<li><input data-i="${i}" maxlength="60" aria-label="Goal ${i + 1}"></li>`
      : `<li><button class="goal" type="button" data-i="${i}"><span class="box">${CHECK}</span><span class="label"></span></button></li>`).join("");
    ul.querySelectorAll(editing ? "input" : ".label").forEach((el, i) => el[editing ? "value" : "textContent"] = state.goals[i]);
    editBtn.classList.toggle("act", editing);
    editBtn.innerHTML = editing ? CHECK : PENCIL;
    editBtn.setAttribute("aria-label", editing ? "Save goals" : "Edit goals");
    paintDay();
  }
  function paintDay() {
    const a = ticks(sel), c = count(sel), off = !open(sel);
    dateEl.textContent = sel.split("-").reverse().join("-");
    barEl.style.width = c / 7 * 100 + "%";
    dayEl.classList.toggle("done", c === 7 && !editing);
    if (!editing) ul.querySelectorAll(".goal").forEach((b, i) => { b.classList.toggle("on", !!a[i]); b.setAttribute("aria-pressed", !!a[i]); b.disabled = off; });
  }
  ul.addEventListener("click", e => {
    const b = e.target.closest(".goal");
    if (!b || !open(sel)) return;
    const a = Array.from({ length: 7 }, (_, j) => !!ticks(sel)[j]);
    a[b.dataset.i] = !a[b.dataset.i];
    state.days[sel] = a;
    save(); paintDay(); renderCal(); paintStreak();
  });
  ul.addEventListener("input", e => { state.goals[e.target.dataset.i] = e.target.value; save(); });
  editBtn.addEventListener("click", () => {
    if (editing) { state.goals = state.goals.map((g, i) => g.trim() || "Goal " + (i + 1)); save(); }
    ul.classList.add("fade"); // fade out, swap, fade back in
    setTimeout(() => { editing = !editing; renderGoals(); ul.classList.remove("fade"); }, 160);
  });

  // ---------- calendar ----------
  function renderCal() {
    const y = view.getFullYear(), m = view.getMonth(), mm = p2(m + 1), days = new Date(y, m + 1, 0).getDate();
    monthEl.textContent = mm + "-" + y;
    prevBtn.disabled = keyOf(view) <= START.slice(0, 8) + "01";
    let h = WEEK + "<span></span>".repeat((new Date(y, m, 1).getDay() + 6) % 7);
    for (let d = 1; d <= days; d++) {
      const k = y + "-" + mm + "-" + p2(d), done = allDone(k);
      h += `<button type="button" class="c${done ? " all" : ""}${k === t ? " t" : ""}${k === sel ? " s" : ""}" data-k="${k}"${open(k) ? "" : " disabled"}><span>${d}</span>${done ? MARK : ""}</button>`;
    }
    grid.innerHTML = h;
  }
  const select = k => { sel = k; editing = false; renderGoals(); renderCal(); };
  grid.addEventListener("click", e => {
    const b = e.target.closest(".c");
    if (b) { select(b.dataset.k); app.scrollTo({ top: 0, behavior: "smooth" }); }
  });
  dateEl.addEventListener("click", () => { if (sel !== t) { showMonth(t); select(t); } }); // tap the date: back to today
  prevBtn.addEventListener("click", () => { view.setMonth(view.getMonth() - 1); renderCal(); });
  nextBtn.addEventListener("click", () => { view.setMonth(view.getMonth() + 1); renderCal(); });

  // ---------- streak: white at 0, fully green at 30 days ----------
  function paintStreak() {
    const d = parse(t); let n = 0;
    if (!allDone(t)) d.setDate(d.getDate() - 1);
    for (let k; (k = keyOf(d)) >= START && allDone(k); d.setDate(d.getDate() - 1)) n++;
    const f = Math.min(n / 30, 1), mix = (a, b) => Math.round(a + (b - a) * f);
    streakEl.textContent = n;
    streakEl.style.color = `rgb(${mix(255, 34)},${mix(255, 197)},${mix(255, 94)})`;
  }

  // ---------- new day at midnight, or when the app is reopened ----------
  function rollover() {
    const n = today();
    if (n === t) return;
    if (sel === t) sel = n;
    t = n; showMonth(n); renderGoals(); renderCal(); paintStreak();
  }
  setInterval(rollover, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) rollover(); });

  renderGoals(); renderCal(); paintStreak();

  // Remove the offline worker and saved copies left by earlier versions.
  navigator.serviceWorker?.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
  window.caches?.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(() => {});
})();
</script>
</body>
</html>
