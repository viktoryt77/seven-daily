<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Seven Daily</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Seven">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<style>
:root{
  color-scheme:dark;
  --bg:#0a0a0a; --surface:#141414; --ink:#ffffff; --muted:#8c8c8c; --line:#262626;
  --green:#22c55e; --green-soft:#0f2417; --green-ink:#0a0a0a; --part:#1c1c1c;
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{
  margin:0;color:var(--ink);font-family:var(--font);font-size:16px;
  padding-top:calc(env(safe-area-inset-top, 0px) + 16px);
  padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 32px);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
h1{font-weight:700;font-size:2rem;line-height:1;margin:0;letter-spacing:-.02em}
.date{color:var(--muted);font-size:.9rem;margin-top:6px}
.streak{text-align:right;font-variant-numeric:tabular-nums}
.streak b{font-size:1.8rem;line-height:1;display:block;color:#ffffff;transition:color .4s}
.streak span{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.dayhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.dayhead h2,.cal-head h2{font-weight:600;font-size:1.1rem;margin:0}
.count{font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted);font-size:.9rem}
.card.done{background:var(--green-soft);border-color:var(--green)}
.card.done .count{color:var(--green)}
.bar{height:5px;border-radius:3px;background:var(--part);overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;background:var(--green);width:0;transition:width .25s}

ul{list-style:none;margin:0;padding:0}
li{border-top:1px solid var(--line)}
li:first-child{border-top:0}
.goal{display:flex;align-items:center;gap:14px;width:100%;padding:13px 2px;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.goal:disabled{cursor:default;opacity:.5}
.box{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid #3a3a3a;display:grid;place-items:center;color:var(--green-ink);transition:background .15s,border-color .15s}
.box svg{width:16px;height:16px;opacity:0;transition:opacity .15s}
.goal.on .box{background:var(--green);border-color:var(--green)}
.goal.on .box svg{opacity:1}
.goal.on .label{color:var(--muted);text-decoration:line-through}
.label{flex:1;min-width:0;overflow-wrap:anywhere}
.goal input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;-webkit-user-select:text;user-select:text}
.num{flex:none;width:28px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}

.row{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:12px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;font-size:.9rem;border-radius:10px;padding:9px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.btn:focus-visible,.goal:focus-visible,.cell:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.note{font-size:.8rem;color:var(--muted)}

.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.nav{display:flex;gap:6px}
.nav button{width:36px;height:36px;padding:0;font-size:1.1rem}
.nav button:disabled{opacity:.3;cursor:default}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:center}
.cell{aspect-ratio:1;max-width:100%;border-radius:10px;border:1px solid transparent;background:var(--part);color:var(--ink);font:inherit;font-size:.85rem;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;padding:0}
.cell.blank{background:none;cursor:default}
.cell.future,.cell.before{background:none;border-color:var(--line);color:var(--muted);cursor:default;opacity:.5}
.cell.all{background:var(--green);color:var(--green-ink);font-weight:700}
.cell.today{border-color:var(--ink)}
.cell.sel{box-shadow:0 0 0 2px var(--green)}
.cell .mk{width:13px;height:13px}
.cell small{font-size:.6rem;color:var(--muted)}
.legend{display:flex;gap:16px;margin-top:12px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.foot{display:flex;justify-content:center}
.btn.quiet{background:none;border-color:transparent;color:var(--muted);font-weight:500}

/* PIN lock screen */
body.locked .wrap{visibility:hidden}
.lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
.lock-inner{width:100%;max-width:300px;display:flex;flex-direction:column;align-items:center;gap:22px}
.lock-title{font-size:1.15rem;font-weight:600;text-align:center}
.lock-msg{min-height:1.2em;font-size:.85rem;color:var(--muted);text-align:center}
.lock-msg.err{color:#ff6b6b}
.dots{display:flex;gap:18px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);transition:background .1s}
.dots i.on{background:var(--ink)}
.dots.ok i{border-color:var(--green);background:var(--green)}
.dots.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:16px 22px}
.key{width:72px;height:72px;border-radius:50%;border:0;background:var(--part);color:var(--ink);font:inherit;font-size:1.7rem;font-weight:400;cursor:pointer}
.key:active{background:#333}
.key.ghost{background:none;font-size:1.3rem}
.key:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.lock-foot{display:flex;gap:12px;justify-content:center;min-height:40px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body class="locked">
<div class="lock" id="lock">
  <div class="lock-inner">
    <div class="lock-title" id="lockTitle">Enter your PIN</div>
    <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
    <div class="lock-msg" id="lockMsg"></div>
    <div class="pad" id="pad"></div>
    <div class="lock-foot">
      <button class="btn quiet" id="lockCancel" type="button" hidden>Cancel</button>
      <button class="btn quiet" id="forgot" type="button" hidden>Forgot PIN?</button>
    </div>
  </div>
</div>

<div class="wrap">
  <header>
    <div>
      <h1>Seven Daily</h1>
      <div class="date" id="todayLabel"></div>
    </div>
    <div class="streak"><b id="streak">0</b><span>day streak</span></div>
  </header>

  <section class="card" id="dayCard" aria-live="polite">
    <div class="dayhead">
      <h2 id="dayTitle">Today</h2>
      <span class="count" id="count">0 / 7</span>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <ul id="goals"></ul>
    <div class="row">
      <span class="note" id="dayNote">Tap a goal when you've done it.</span>
      <button class="btn" id="editBtn" type="button">Edit goals</button>
    </div>
  </section>

  <section class="card">
    <div class="cal-head">
      <h2 id="monthTitle"></h2>
      <div class="nav">
        <button class="btn" id="prev" type="button" aria-label="Previous month">&#8249;</button>
        <button class="btn" id="next" type="button" aria-label="Next month">&#8250;</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><i style="background:var(--green)"></i>All 7 done</span>
      <span><i style="background:var(--part)"></i>Not finished</span>
      <span><i style="border:1px solid var(--line)"></i>Upcoming</span>
    </div>
  </section>

  <div class="foot"><button class="btn quiet" id="changePin" type="button">Change PIN</button></div>
</div>

<script>
(function(){
  const START = "2026-11-25";
  const KEY = "seven-daily-v1";
  const CHECK = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const DEFAULT_GOALS = ["Goal 1","Goal 2","Goal 3","Goal 4","Goal 5","Goal 6","Goal 7"];
  const LOCALE = "en-US";

  // All data lives on this phone only (localStorage).
  let state = { goals: DEFAULT_GOALS.slice(), days: {} };
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.goals)) state = s; } catch(e){}
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});

  const pad = n => String(n).padStart(2,"0");
  const keyOf = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  const parse = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); };
  const todayKey = () => keyOf(new Date());

  let selected = todayKey() < START ? START : todayKey();
  let editing = false;
  let viewMonth = parse(selected); viewMonth.setDate(1);

  const $ = id => document.getElementById(id);
  const dayArr = k => state.days[k] || [false,false,false,false,false,false,false];
  const doneCount = k => dayArr(k).filter(Boolean).length;
  const isAll = k => doneCount(k) === 7;

  function streak(){
    let d = parse(todayKey()), n = 0;
    if (!isAll(keyOf(d))) d.setDate(d.getDate()-1);
    while (keyOf(d) >= START && isAll(keyOf(d))) { n++; d.setDate(d.getDate()-1); }
    return n;
  }

  function renderDay(){
    const t = todayKey(), k = selected, d = parse(k);
    const long = d.toLocaleDateString(LOCALE,{weekday:"long", month:"long", day:"numeric"});
    $("todayLabel").textContent = parse(t).toLocaleDateString(LOCALE,{weekday:"long", month:"long", day:"numeric", year:"numeric"});
    $("dayTitle").textContent = k === t ? "Today" : long;
    const locked = k > t || k < START;
    const arr = dayArr(k), c = doneCount(k);
    $("count").textContent = c + " / 7";
    $("bar").style.width = (c/7*100) + "%";
    $("dayCard").classList.toggle("done", c === 7 && !editing);
    $("dayNote").textContent = editing ? "Rename your 7 goals." :
      locked ? "This day hasn't come yet." :
      c === 7 ? "All seven done. This day is green." :
      (k === t ? "Tap a goal when you've done it." : "Showing " + long + ".");
    $("editBtn").textContent = editing ? "Done" : "Edit goals";
    $("editBtn").classList.toggle("primary", editing);

    const ul = $("goals"); ul.textContent = "";
    state.goals.forEach((g, i) => {
      const li = document.createElement("li");
      if (editing) {
        const row = document.createElement("div"); row.className = "goal";
        const n = document.createElement("span"); n.className = "num"; n.textContent = i+1;
        const inp = document.createElement("input"); inp.id = "goal-name-"+i; inp.value = g; inp.maxLength = 60;
        inp.setAttribute("aria-label","Goal "+(i+1));
        inp.addEventListener("input", () => { state.goals[i] = inp.value; save(); });
        row.append(n, inp); li.append(row);
      } else {
        const b = document.createElement("button"); b.type = "button";
        b.className = "goal" + (arr[i] ? " on" : ""); b.disabled = locked;
        b.setAttribute("aria-pressed", arr[i] ? "true" : "false");
        const box = document.createElement("span"); box.className = "box"; box.innerHTML = CHECK;
        const lab = document.createElement("span"); lab.className = "label"; lab.textContent = g || ("Goal "+(i+1));
        b.append(box, lab);
        b.addEventListener("click", () => toggle(i));
        li.append(b);
      }
      ul.append(li);
    });
  }

  function renderCal(){
    const t = todayKey(), y = viewMonth.getFullYear(), m = viewMonth.getMonth();
    $("monthTitle").textContent = viewMonth.toLocaleDateString(LOCALE,{month:"long", year:"numeric"});
    const startM = parse(START); startM.setDate(1);
    $("prev").disabled = viewMonth <= startM;
    const grid = $("grid"); grid.textContent = "";
    ["M","T","W","T","F","S","S"].forEach(w => { const e = document.createElement("div"); e.className = "wd"; e.textContent = w; grid.append(e); });
    const offset = (new Date(y, m, 1).getDay() + 6) % 7;
    for (let i = 0; i < offset; i++){ const e = document.createElement("div"); e.className = "cell blank"; grid.append(e); }
    const days = new Date(y, m+1, 0).getDate();
    for (let d = 1; d <= days; d++){
      const k = keyOf(new Date(y, m, d));
      const b = document.createElement("button"); b.type = "button"; b.className = "cell";
      const num = document.createElement("span"); num.textContent = d; b.append(num);
      if (k < START) b.classList.add("before");
      else if (k > t) b.classList.add("future");
      else if (isAll(k)) { b.classList.add("all"); b.insertAdjacentHTML("beforeend", CHECK.replace("<svg", '<svg class="mk"')); }
      else { const c = doneCount(k); if (c) { const s = document.createElement("small"); s.textContent = c+"/7"; b.append(s); } }
      if (k === t) b.classList.add("today");
      if (k === selected) b.classList.add("sel");
      b.setAttribute("aria-label", k + (isAll(k) ? ", all done" : ", " + doneCount(k) + " of 7"));
      if (k >= START && k <= t) b.addEventListener("click", () => { selected = k; editing = false; render(); window.scrollTo({top:0, behavior:"smooth"}); });
      else b.disabled = true;
      grid.append(b);
    }
  }

  // Streak number: white at 0, a bit greener every day, fully green at 30 days.
  const FULL_GREEN_DAYS = 30;
  function streakColor(n){
    const t = Math.min(n / FULL_GREEN_DAYS, 1);
    const mix = (a, b) => Math.round(a + (b - a) * t);
    return "rgb(" + mix(255, 34) + "," + mix(255, 197) + "," + mix(255, 94) + ")";
  }

  function render(){
    renderDay(); renderCal();
    const s = streak();
    $("streak").textContent = s;
    $("streak").style.color = streakColor(s);
  }

  function toggle(i){
    const k = selected;
    if (k > todayKey() || k < START) return;
    const arr = dayArr(k).slice(); arr[i] = !arr[i];
    state.days[k] = arr;
    save(); render();
  }

  $("editBtn").addEventListener("click", () => {
    if (editing) state.goals = state.goals.map((g, i) => g.trim() || ("Goal "+(i+1)));
    editing = !editing; save(); render();
  });
  $("prev").addEventListener("click", () => { viewMonth.setMonth(viewMonth.getMonth()-1); renderCal(); });
  $("next").addEventListener("click", () => { viewMonth.setMonth(viewMonth.getMonth()+1); renderCal(); });

  // Move to the new day at midnight, or when the app is reopened.
  // "Today" always comes from the phone's own clock and time zone.
  let lastToday = todayKey();
  function rollover(){ const t = todayKey(); if (t !== lastToday) { if (selected === lastToday) selected = t; lastToday = t; viewMonth = parse(t); viewMonth.setDate(1); } render(); }
  setInterval(rollover, 30000);

  // ---------- PIN lock ----------
  // The app locks on start and after being in the background for 30 seconds.
  const PIN_KEY = "seven-daily-pin";
  const RELOCK_MS = 30000;
  let flow = null, entry = "", busy = false, forgotArmed = 0, hiddenAt = 0;

  async function hashPin(pin, salt){
    const data = new TextEncoder().encode(salt + ":" + pin);
    const buf = await crypto.subtle.digest("SHA-256", data);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
  }
  function loadPin(){ try { return JSON.parse(localStorage.getItem(PIN_KEY)); } catch(e){ return null; } }
  async function storePin(pin){
    const salt = Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b => b.toString(16).padStart(2,"0")).join("");
    try { localStorage.setItem(PIN_KEY, JSON.stringify({ salt, hash: await hashPin(pin, salt) })); } catch(e){}
  }
  async function checkPin(pin){ const p = loadPin(); return !!p && (await hashPin(pin, p.salt)) === p.hash; }

  const TITLES = {
    unlock: ["Enter your PIN"],
    create: ["Create a 4-digit PIN", "Enter the PIN again"],
    change: ["Enter your current PIN", "Enter a new 4-digit PIN", "Enter the new PIN again"]
  };

  function openLock(mode){
    flow = { mode, step: 0, first: "" };
    entry = ""; forgotArmed = 0;
    document.body.classList.add("locked");
    $("lock").hidden = false;
    $("lockCancel").hidden = mode !== "change";
    $("forgot").hidden = mode !== "unlock";
    $("forgot").textContent = "Forgot PIN?";
    setMsg(mode === "create" ? "You'll enter it every time you open the app." : "");
    updateLock();
  }
  function closeLock(){
    flow = null; entry = "";
    $("lock").hidden = true;
    document.body.classList.remove("locked");
    rollover();
  }
  function setMsg(text, err){ $("lockMsg").textContent = text; $("lockMsg").classList.toggle("err", !!err); }
  function updateLock(){
    $("lockTitle").textContent = TITLES[flow.mode][flow.step];
    [...$("dots").children].forEach((d, i) => d.classList.toggle("on", i < entry.length));
  }
  function fail(text){
    const dots = $("dots");
    dots.classList.remove("shake"); void dots.offsetWidth; dots.classList.add("shake");
    if (navigator.vibrate) navigator.vibrate(80);
    setMsg(text, true);
  }
  function success(){
    $("dots").classList.add("ok");
    setTimeout(() => { $("dots").classList.remove("ok"); closeLock(); }, 220);
  }

  async function submit(pin){
    busy = true;
    const f = flow;
    if (f.mode === "unlock") {
      if (await checkPin(pin)) success(); else fail("Wrong PIN. Try again.");
    } else if (f.mode === "create" || (f.mode === "change" && f.step > 0)) {
      const firstStep = f.mode === "create" ? 0 : 1;
      if (f.step === firstStep) { f.first = pin; f.step++; setMsg(""); }
      else if (pin === f.first) { await storePin(pin); setMsg(f.mode === "change" ? "PIN changed." : ""); success(); }
      else { f.step = firstStep; f.first = ""; fail("The PINs didn't match. Start again."); }
    } else if (f.mode === "change") {
      if (await checkPin(pin)) { f.step = 1; setMsg(""); } else fail("That's not your current PIN.");
    }
    entry = ""; busy = false;
    if (flow) updateLock();
  }

  function press(k){
    if (!flow || busy) return;
    if (k === "del") { entry = entry.slice(0, -1); updateLock(); return; }
    if (entry.length >= 4) return;
    entry += k; updateLock();
    if (entry.length === 4) { const pin = entry; setTimeout(() => submit(pin), 120); busy = true; }
  }

  ["1","2","3","4","5","6","7","8","9","","0","del"].forEach(k => {
    if (!k) { $("pad").append(document.createElement("span")); return; }
    const b = document.createElement("button");
    b.type = "button"; b.className = "key" + (k === "del" ? " ghost" : "");
    b.textContent = k === "del" ? "⌫" : k;
    b.setAttribute("aria-label", k === "del" ? "Delete" : k);
    b.addEventListener("click", () => press(k));
    $("pad").append(b);
  });
  document.addEventListener("keydown", e => {
    if (!flow) return;
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key === "Backspace") press("del");
  });

  $("lockCancel").addEventListener("click", closeLock);
  $("changePin").addEventListener("click", () => openLock("change"));
  $("forgot").addEventListener("click", () => {
    if (Date.now() - forgotArmed < 6000) {
      try { localStorage.removeItem(KEY); localStorage.removeItem(PIN_KEY); } catch(e){}
      state = { goals: DEFAULT_GOALS.slice(), days: {} };
      selected = todayKey() < START ? START : todayKey();
      render(); openLock("create");
      return;
    }
    forgotArmed = Date.now();
    $("forgot").textContent = "Tap again to erase everything";
    setMsg("Without the PIN, the only way in is to erase all your goals and history.", true);
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    if (!flow && loadPin() && hiddenAt && Date.now() - hiddenAt > RELOCK_MS) openLock("unlock");
    else rollover();
  });

  render();
  openLock(loadPin() ? "unlock" : "create");

  // Offline support
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body>
</html>
