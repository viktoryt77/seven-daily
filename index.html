<!doctype html>
<html lang="en" style="background:#0a0a0a">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Seven Daily</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Seven">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<!-- Dark launch screens (iOS shows white without a matching one) -->
<link rel="apple-touch-startup-image" href="splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash-960x2079.png" media="(device-width: 320px) and (device-height: 693px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash-1080x2340.png" media="(device-width: 360px) and (device-height: 780px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash-1242x2208.png" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash-1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash-1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash-1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<style>
:root{--bg:#0a0a0a;--sf:#141414;--ink:#fff;--mu:#8c8c8c;--ln:#262626;--g:#22c55e;--gs:#0f2417;--pt:#1c1c1c}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg)}
body{color:var(--ink);font:16px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
/* The app scrolls inside #app, so the scroll bar can be hidden */
#app{height:100%;overflow-y:auto;scrollbar-width:none;
  padding:calc(env(safe-area-inset-top) + 16px) max(16px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 24px) max(16px,env(safe-area-inset-left))}
#app::-webkit-scrollbar{display:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--g);outline-offset:2px}
svg{display:block}

.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:16px;transition:opacity .4s ease,transform .4s ease}
body.locked .wrap{opacity:0;transform:scale(.97)}
header{display:flex;justify-content:space-between;align-items:baseline;font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}

.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:16px}
#day.done{background:var(--gs);border-color:var(--g)}
.bar{height:5px;border-radius:3px;background:var(--pt);overflow:hidden;margin-bottom:6px}
#bar{height:100%;width:0;background:var(--g);transition:width .25s}
#goals{list-style:none;margin:0;padding:0}
#goals li+li{border-top:1px solid var(--ln)}
.goal{display:flex;align-items:center;gap:14px;width:100%;padding:13px 2px;text-align:left}
.goal:disabled{opacity:.5;cursor:default}
.box{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid #3a3a3a;display:grid;place-items:center;color:var(--bg)}
.box svg{width:16px;height:16px;opacity:0}
.on .box{background:var(--g);border-color:var(--g)}
.on .box svg{opacity:1}
.label{flex:1;min-width:0;overflow-wrap:anywhere}
.on .label{color:var(--mu);text-decoration:line-through}
#goals input{width:100%;margin:5px 0;padding:8px 10px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:8px;-webkit-user-select:text;user-select:text}

.row{display:flex;justify-content:space-between;align-items:center}
.tools{justify-content:flex-end;gap:4px;margin-top:6px}
.ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--mu);font-size:1.3rem}
.ico svg{width:20px;height:20px}
.ico.act{background:var(--g);color:var(--bg)}
.ico:disabled{opacity:.3;cursor:default}

#month{font-weight:600;font-variant-numeric:tabular-nums}
#grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.wd{font-size:.7rem;color:var(--mu);text-align:center}
.c{aspect-ratio:1;border-radius:10px;border:1px solid transparent;background:var(--pt);font-size:.85rem;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.c .mk{width:13px;height:13px}
.c:disabled{background:none;border-color:var(--ln);color:var(--mu);opacity:.5;cursor:default}
.c.all{background:var(--g);color:var(--bg);font-weight:700}
.c.t{border-color:var(--ink)}
.c.s{box-shadow:0 0 0 2px var(--g)}

#lock{position:fixed;inset:0;z-index:9;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:16px;transition:opacity .35s ease}
#lock.out{opacity:0;pointer-events:none}
.brand{display:flex;align-items:center;justify-content:center;gap:12px;font-size:2rem;font-weight:700;letter-spacing:-.01em}
#logo{width:52px;height:52px;border-radius:13px}
#lockT{font-size:1.2rem;font-weight:600}
#dots{display:flex;gap:20px}
#dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);transition:background .15s ease,border-color .15s ease}
#dots i.on{background:var(--ink)}
#dots.ok i{border-color:var(--g);background:var(--g)}
#dots.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#pad{display:grid;grid-template-columns:repeat(3,80px);gap:18px 24px}
.key{width:80px;height:80px;border-radius:50%;background:var(--pt);font-size:1.9rem;transition:background .3s ease}
.key:active{background:#3a3a3a;transition:none}
.key.gh{background:none;font-size:1.4rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body class="locked">
<div id="lock">
  <div class="brand"><span>Seven Daily</span><img id="logo" src="icon-180.png" alt=""></div>
  <div id="lockT" hidden></div>
  <div id="dots"><i></i><i></i><i></i><i></i></div>
  <div id="pad"></div>
</div>

<div id="app"><div class="wrap">
  <header><span id="date"></span><span id="streak">0</span></header>

  <section class="card" id="day">
    <div class="bar"><div id="bar"></div></div>
    <ul id="goals"></ul>
    <div class="row tools">
      <button class="ico" id="edit" type="button" aria-label="Edit goals"></button>
      <button class="ico" id="pin" type="button" aria-label="Change PIN"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
    </div>
  </section>

  <section class="card">
    <div class="row">
      <span id="month"></span>
      <span class="row"><button class="ico" id="prev" type="button" aria-label="Previous month">&#8249;</button><button class="ico" id="next" type="button" aria-label="Next month">&#8250;</button></span>
    </div>
    <div id="grid"></div>
  </section>
</div></div>

<script>
(() => {
  const START = "2026-11-25", KEY = "seven-daily-v1", PIN_KEY = "seven-daily-pin", RELOCK_MS = 30000, LS = localStorage;
  const CHECK = '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.2 3L13 4.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const MARK = CHECK.replace("<svg", '<svg class="mk"');
  const PENCIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
  const $ = id => document.getElementById(id);
  const [app, ul, editBtn, dateEl, barEl, dayEl, grid, monthEl, prevBtn, streakEl, lockEl, lockT, dotsEl, pad, nextBtn] =
    ["app", "goals", "edit", "date", "bar", "day", "grid", "month", "prev", "streak", "lock", "lockT", "dots", "pad", "next"].map($);
  const WEEK = [..."MTWTFSS"].map(w => `<span class="wd">${w}</span>`).join("");
  const p2 = n => String(n).padStart(2, "0");
  const keyOf = d => d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate());
  const parse = k => { const [y, m, d] = k.split("-"); return new Date(y, m - 1, d); };
  const today = () => keyOf(new Date());
  const hex = a => Array.from(a, b => b.toString(16).padStart(2, "0")).join("");

  // ---------- data (stored only on this phone) ----------
  let state;
  try { state = JSON.parse(LS.getItem(KEY)); } catch (e) {}
  if (!state || !Array.isArray(state.goals)) state = { goals: Array.from({ length: 7 }, (_, i) => "Goal " + (i + 1)), days: {} };
  const save = () => { try { LS.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
  navigator.storage?.persist?.().catch(() => {});

  let t = today(), sel = t < START ? START : t, editing = false;
  let view = parse(sel); view.setDate(1);
  const ticks = k => state.days[k] || [];
  const count = k => ticks(k).filter(Boolean).length;
  const allDone = k => count(k) === 7;
  const open = k => k >= START && k <= t;

  // ---------- today's goals ----------
  function renderGoals() {
    ul.innerHTML = state.goals.map((_, i) => editing
      ? `<li><input data-i="${i}" maxlength="60" aria-label="Goal ${i + 1}"></li>`
      : `<li><button class="goal" type="button" data-i="${i}"><span class="box">${CHECK}</span><span class="label"></span></button></li>`).join("");
    ul.querySelectorAll(editing ? "input" : ".label").forEach((el, i) => editing ? el.value = state.goals[i] : el.textContent = state.goals[i]);
    editBtn.classList.toggle("act", editing);
    editBtn.innerHTML = editing ? CHECK : PENCIL;
    editBtn.setAttribute("aria-label", editing ? "Save goals" : "Edit goals");
    paintDay();
  }
  function paintDay() {
    const a = ticks(sel), c = count(sel), off = !open(sel);
    dateEl.textContent = sel.split("-").reverse().join("-");
    barEl.style.width = c / 7 * 100 + "%";
    dayEl.classList.toggle("done", c === 7 && !editing);
    if (!editing) ul.querySelectorAll(".goal").forEach((b, i) => { b.classList.toggle("on", !!a[i]); b.setAttribute("aria-pressed", !!a[i]); b.disabled = off; });
  }
  ul.addEventListener("click", e => {
    const b = e.target.closest(".goal");
    if (!b || !open(sel)) return;
    const a = Array.from({ length: 7 }, (_, j) => !!ticks(sel)[j]);
    a[b.dataset.i] = !a[b.dataset.i];
    state.days[sel] = a;
    save(); paintDay(); renderCal(); paintStreak();
  });
  ul.addEventListener("input", e => { state.goals[e.target.dataset.i] = e.target.value; save(); });
  editBtn.addEventListener("click", () => {
    if (editing) { state.goals = state.goals.map((g, i) => g.trim() || "Goal " + (i + 1)); save(); }
    editing = !editing; renderGoals();
  });

  // ---------- calendar ----------
  function renderCal() {
    const y = view.getFullYear(), m = view.getMonth(), days = new Date(y, m + 1, 0).getDate();
    const mm = p2(m + 1);
    monthEl.textContent = mm + "-" + y;
    prevBtn.disabled = keyOf(view) <= START.slice(0, 8) + "01";
    let h = WEEK + "<span></span>".repeat((new Date(y, m, 1).getDay() + 6) % 7);
    for (let d = 1; d <= days; d++) {
      const k = y + "-" + mm + "-" + p2(d), done = allDone(k);
      h += `<button type="button" class="c${done ? " all" : ""}${k === t ? " t" : ""}${k === sel ? " s" : ""}" data-k="${k}"${open(k) ? "" : " disabled"}><span>${d}</span>${done ? MARK : ""}</button>`;
    }
    grid.innerHTML = h;
  }
  grid.addEventListener("click", e => {
    const b = e.target.closest(".c");
    if (!b) return;
    sel = b.dataset.k; editing = false;
    renderGoals(); renderCal(); app.scrollTo({ top: 0, behavior: "smooth" });
  });
  prevBtn.addEventListener("click", () => { view.setMonth(view.getMonth() - 1); renderCal(); });
  nextBtn.addEventListener("click", () => { view.setMonth(view.getMonth() + 1); renderCal(); });

  // ---------- streak: white at 0, fully green at 30 days ----------
  function paintStreak() {
    const d = parse(t); let n = 0;
    if (!allDone(t)) d.setDate(d.getDate() - 1);
    for (let k; (k = keyOf(d)) >= START && allDone(k); d.setDate(d.getDate() - 1)) n++;
    const f = Math.min(n / 30, 1), mix = (a, b) => Math.round(a + (b - a) * f);
    streakEl.textContent = n;
    streakEl.style.color =`rgb(${mix(255, 34)},${mix(255, 197)},${mix(255, 94)})`;
  }

  const render = () => { renderGoals(); renderCal(); paintStreak(); };
  function rollover() {
    const n = today();
    if (n === t) return;
    if (sel === t) sel = n;
    t = n; view = parse(n); view.setDate(1); render();
  }
  setInterval(rollover, 30000);

  // ---------- PIN lock (on start, and after 30 s in the background) ----------
  const TITLES = { unlock: [""], create: ["New PIN", "Repeat PIN"], change: ["Current PIN", "New PIN", "Repeat PIN"] };
  const dots = [...dotsEl.children];
  dotsEl.addEventListener("animationend", () => dotsEl.classList.remove("shake")); // so it never replays when the screen reopens
  let flow = null, entry = "", busy = false, hiddenAt = 0;

  const hashPin = async (pin, salt) => hex(new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(salt + ":" + pin))));
  const loadPin = () => { try { return JSON.parse(LS.getItem(PIN_KEY)); } catch (e) { return null; } };
  const checkPin = async pin => { const p = loadPin(); return !!p && await hashPin(pin, p.salt) === p.hash; };
  async function storePin(pin) {
    const salt = hex(crypto.getRandomValues(new Uint8Array(16)));
    try { LS.setItem(PIN_KEY, JSON.stringify({ salt, hash: await hashPin(pin, salt) })); } catch (e) {}
  }

  function openLock(mode) {
    flow = { mode, step: 0, first: "" }; entry = "";
    dotsEl.classList.remove("shake", "ok");
    if (lockEl.hidden) { lockEl.hidden = false; lockEl.classList.add("out"); void lockEl.offsetWidth; } // start invisible, then fade in
    lockEl.classList.remove("out");
    document.body.classList.add("locked");
    $("x").style.visibility = mode === "change" ? "visible" : "hidden";
    paintLock();
  }
  function closeLock() {
    flow = null; entry = "";
    lockEl.classList.add("out");               // lock fades out...
    document.body.classList.remove("locked");  // ...while the app fades and grows in
    setTimeout(() => { if (!flow) { lockEl.hidden = true; lockEl.classList.remove("out"); dotsEl.classList.remove("ok"); } }, 400);
    rollover();
  }
  function paintLock() {
    const title = TITLES[flow.mode][flow.step];
    lockT.textContent = title; lockT.hidden = !title;
    dots.forEach((d, i) => d.classList.toggle("on", i < entry.length));
  }
  function shake() {
    dotsEl.classList.remove("shake"); void dotsEl.offsetWidth; dotsEl.classList.add("shake");
    navigator.vibrate?.(80);
  }
  function unlocked() {
    dotsEl.classList.add("ok");
    setTimeout(() => { busy = false; closeLock(); }, 220);
  }

  async function submit(pin) {
    const f = flow, firstStep = f.mode === "create" ? 0 : 1;
    let done = false;
    if (f.mode === "unlock") { if (await checkPin(pin)) done = true; else shake(); }
    else if (f.mode === "change" && f.step === 0) { if (await checkPin(pin)) f.step = 1; else shake(); }
    else if (f.step === firstStep) { f.first = pin; f.step++; }
    else if (pin === f.first) { await storePin(pin); done = true; }
    else { f.step = firstStep; f.first = ""; shake(); }
    entry = "";
    if (done) unlocked(); else { busy = false; paintLock(); }
  }

  function press(k) {
    if (!flow || busy) return;
    if (k === "x") { if (flow.mode === "change") closeLock(); return; }
    if (k === "del") entry = entry.slice(0, -1);
    else if (entry.length < 4) entry += k;
    paintLock();
    if (entry.length === 4) { busy = true; setTimeout(submit, 120, entry); }
  }

  pad.innerHTML = [..."123456789"].map(k => `<button class="key" type="button" data-k="${k}">${k}</button>`).join("")
    + '<button class="key gh" id="x" type="button" data-k="x" aria-label="Cancel">&#10005;</button>'
    + '<button class="key" type="button" data-k="0">0</button>'
    + '<button class="key gh" type="button" data-k="del" aria-label="Delete">&#9003;</button>';
  pad.addEventListener("click", e => { const b = e.target.closest(".key"); if (b) press(b.dataset.k); });
  document.addEventListener("keydown", e => {
    if (!flow) return;
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key === "Backspace") press("del");
  });
  $("pin").addEventListener("click", () => openLock("change"));

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    if (!flow && loadPin() && Date.now() - hiddenAt > RELOCK_MS) openLock("unlock");
    else rollover();
  });

  render();
  openLock(loadPin() ? "unlock" : "create");
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
